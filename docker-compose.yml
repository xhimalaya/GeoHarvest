services:
  db:
    image: postgres:16-alpine
    container_name: geoharvest-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-geouser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geopass}
      POSTGRES_DB: ${POSTGRES_DB:-geoharvest}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geouser} -d ${POSTGRES_DB:-geoharvest}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  geoharvest:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geoharvest
    restart: unless-stopped
    # Run as host user so all downloaded and processed files belong to your local user
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "9009:9009"
    environment:
      - GEOHARVEST_HOST=0.0.0.0
      - GEOHARVEST_PORT=9009
      - GEOHARVEST_HOST_HOME_PATH=${HOME:-/home/awadh}
      - GEOHARVEST_GEOSERVER_ENABLED=true
      - GEOHARVEST_GEOSERVER_REST_URL=http://geoserver:8080/geoserver
      - GEOHARVEST_GEOSERVER_PUBLIC_URL=http://localhost:${GEOSERVER_PORT:-8080}/geoserver
      - GEOHARVEST_GEOSERVER_ADMIN_USER=${GEOSERVER_ADMIN_USER:-admin}
      - GEOHARVEST_GEOSERVER_ADMIN_PASSWORD=${GEOSERVER_ADMIN_PASSWORD:-geoserver-change-me}
      - GEOHARVEST_GEOSERVER_WORKSPACE=geoharvest
      - GEOHARVEST_GEOSERVER_DOWNLOADS_MOUNT=/opt/geoserver_data/downloads
      - GEOHARVEST_GEOSERVER_EXTERNAL_MOUNT=/opt/geoserver_external
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.1-pro-preview}
      - GEOHARVEST_DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-geouser}:${POSTGRES_PASSWORD:-geopass}@db:5432/${POSTGRES_DB:-geoharvest}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
      geoserver:
        condition: service_started
    volumes:
      # SATELLITE DOWNLOADS: saved directly into your local computer
      # (Defaults to ./data/downloads; can be overridden via LOCAL_DOWNLOADS_DIR in .env)
      - ${LOCAL_DOWNLOADS_DIR:-./data/downloads}:/app/data/downloads
      # PROCESSED RASTER OUTPUTS: saved directly into your local computer
      # (Defaults to ./data/processed; can be overridden via LOCAL_PROCESSED_DIR in .env)
      - ${LOCAL_PROCESSED_DIR:-./data/processed}:/app/data/processed
      # CREDENTIALS: saved on your local computer
      - ./data/credentials:/app/data/credentials
      # AOI GEOJSON FILES: saved on your local computer
      - ./data/aois:/app/data/aois
      # GeoServer mirror for downloads directed to a custom folder
      - ./data/geoserver_files:/app/data/geoserver_files
      # HOST HOME MOUNT: allows the in-app Directory Picker to browse and save to your local computer's ~/Downloads, Desktop, etc.
      - ${HOME:-/home/awadh}:/host_home:rw

  geoserver:
    image: docker.osgeo.org/geoserver:${GEOSERVER_VERSION:-3.0.2}
    container_name: geoharvest-geoserver
    restart: unless-stopped
    ports:
      - "${GEOSERVER_BIND_ADDRESS:-127.0.0.1}:${GEOSERVER_PORT:-8080}:8080"
    environment:
      SKIP_DEMO_DATA: "true"
      CORS_ENABLED: "true"
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:-admin}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:-geoserver-change-me}
      EXTRA_JAVA_OPTS: ${GEOSERVER_JAVA_OPTS:--Xms512m -Xmx2g}
    volumes:
      - geoserver_data:/opt/geoserver_data
      # GeoServer reads the same persistent download folder used by GeoHarvest.
      - ${LOCAL_DOWNLOADS_DIR:-./data/downloads}:/opt/geoserver_data/downloads:ro
      # Custom destination downloads are mirrored here before publishing.
      - ./data/geoserver_files:/opt/geoserver_external:ro

volumes:
  postgres_data:
  geoserver_data:

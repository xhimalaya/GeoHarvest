services:
  geoharvest:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geoharvest
    restart: unless-stopped
    # Run as host user so all downloaded and processed files belong to your local user
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "9009:9009"
    environment:
      - GEOHARVEST_HOST=0.0.0.0
      - GEOHARVEST_PORT=9009
    env_file:
      - path: .env
        required: false
    volumes:
      # SATELLITE DOWNLOADS: saved directly into your local computer
      # (Defaults to ./data/downloads; can be overridden via LOCAL_DOWNLOADS_DIR in .env)
      - ${LOCAL_DOWNLOADS_DIR:-./data/downloads}:/app/data/downloads
      # PROCESSED RASTER OUTPUTS: saved directly into your local computer
      # (Defaults to ./data/processed; can be overridden via LOCAL_PROCESSED_DIR in .env)
      - ${LOCAL_PROCESSED_DIR:-./data/processed}:/app/data/processed
      # CREDENTIALS: saved on your local computer
      - ./data/credentials:/app/data/credentials
      # AOI GEOJSON FILES: saved on your local computer
      - ./data/aois:/app/data/aois
      # SQLITE DATABASE & JOB HISTORY: saved on your local computer
      - ./data/geoharvest.db:/app/data/geoharvest.db
      # HOST HOME MOUNT: allows the in-app Directory Picker to browse and save to your local computer's ~/Downloads, Desktop, etc.
      - ${HOME:-/home/himalaya}:/host_home:rw

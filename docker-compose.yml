services:
  db:
    image: postgres:16-alpine
    container_name: geoharvest-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-geouser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geopass}
      POSTGRES_DB: ${POSTGRES_DB:-geoharvest}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geouser} -d ${POSTGRES_DB:-geoharvest}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  ollama:
    image: ollama/ollama:latest
    container_name: geoharvest-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11435}:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5-coder:3b}
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        SERVER_PID=$$!
        trap 'kill -TERM $$SERVER_PID 2>/dev/null || true; wait $$SERVER_PID' TERM INT
        (until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull "$$OLLAMA_MODEL" || true) &
        wait $$SERVER_PID
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  geoharvest:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geoharvest
    restart: unless-stopped
    # Run as host user so all downloaded and processed files belong to your local user
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "9009:9009"
    environment:
      - GEOHARVEST_HOST=0.0.0.0
      - GEOHARVEST_PORT=9009
      - GEOHARVEST_DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-geouser}:${POSTGRES_PASSWORD:-geopass}@db:5432/${POSTGRES_DB:-geoharvest}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5-coder:3b}
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    volumes:
      # SATELLITE DOWNLOADS: saved directly into your local computer
      # (Defaults to ./data/downloads; can be overridden via LOCAL_DOWNLOADS_DIR in .env)
      - ${LOCAL_DOWNLOADS_DIR:-./data/downloads}:/app/data/downloads
      # PROCESSED RASTER OUTPUTS: saved directly into your local computer
      # (Defaults to ./data/processed; can be overridden via LOCAL_PROCESSED_DIR in .env)
      - ${LOCAL_PROCESSED_DIR:-./data/processed}:/app/data/processed
      # CREDENTIALS: saved on your local computer
      - ./data/credentials:/app/data/credentials
      # AOI GEOJSON FILES: saved on your local computer
      - ./data/aois:/app/data/aois
      # HOST HOME MOUNT: allows the in-app Directory Picker to browse and save to your local computer's ~/Downloads, Desktop, etc.
      - ${HOME:-/home/awadh}:/host_home:rw

volumes:
  postgres_data:
  ollama_data:

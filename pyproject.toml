[project]
name = "geoharvest"
version = "0.1.0"
description = "High-performance geospatial data harvesting and processing platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "aiohttp>=3.10.0",
    "shapely>=2.0.0",
    "geopandas>=1.0.0",
    "pyproj>=3.6.0",
    "rasterio>=1.3.0",
    "psutil>=6.0.0",
    "pystac>=1.10.0",
    "pystac-client>=0.8.0",
    "python-multipart>=0.0.9",
    "boto3>=1.34.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "earthengine-api>=1.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geoharvest"
version = "0.2.0"
description = "High-performance geospatial data harvesting, OGC WMS, Earth Engine, and raster geoprocessing platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "aiohttp>=3.10.0",
    "requests>=2.32.0",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "s3transfer>=0.10.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "pandas>=2.2.0",
    "shapely>=2.0.0",
    "geopandas>=1.0.0",
    "pyogrio>=0.9.0",
    "pyproj>=3.6.0",
    "rasterio>=1.3.10",
    "affine>=2.4.0",
    "rioxarray>=0.17.0",
    "xarray>=2024.0.0",
    "pillow>=10.4.0",
    "owslib>=0.31.0",
    "lxml>=5.2.0",
    "pystac>=1.10.0",
    "pystac-client>=0.8.0",
    "planetary-computer>=1.0.0",
    "cdsapi>=0.7.0",
    "earthengine-api>=1.4.0",
    "google-auth>=2.30.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "google-api-python-client>=2.130.0",
    "google-cloud-storage>=2.16.0",
    "psutil>=6.0.0",
    "tqdm>=4.66.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

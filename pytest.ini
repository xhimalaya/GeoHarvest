[pytest]
testpaths = tests
asyncio_mode = strict
addopts = -ra
markers =
    unit: Fast, isolated unit tests without external I/O
    integration: Multi-component API, pipeline, and workflow integration tests
    geospatial: Rasterio, GDAL, Shapely, PyProj coordinate and raster transformation tests
    physical: Physical tests verifying actual on-disk raster/vector dataset outputs
    slow: Long-running or heavy computational tests

<!DOCTYPE html>
<html lang="en" class="theme-day">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237D2142' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='10'/><path d='M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20'/><path d='M2 12h20'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeoHarvest — Geospatial Research &amp; Data Acquisition</title>
    <!-- Typography: Source Sans 3, Inter, IBM Plex Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- OpenLayers CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v10.0.0/ol.css">
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('geoharvest_theme');
          var theme = 'day';
          if (raw === 'night' || raw === 'bw-dark' || raw === 'dark') {
            theme = 'night';
          } else if (raw === 'day' || raw === 'bw-light') {
            theme = 'day';
          }
          localStorage.setItem('geoharvest_theme', theme);
          var root = document.documentElement;
          root.classList.remove('theme-day', 'theme-night', 'theme-bw-light', 'theme-bw-dark', 'theme-dark', 'dark');
          root.classList.add('theme-' + theme);
          if (theme === 'night') {
            root.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased h-screen overflow-hidden">
    <div id="app" class="h-full w-full"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
